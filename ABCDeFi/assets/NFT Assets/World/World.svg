<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="worldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="voyagerHelm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Background Glow -->
  <circle cx="400" cy="400" r="360" fill="url(#worldGlow)" />
  
  <!-- Outer Tech Ring -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="400" cy="400" r="300" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- World Globe Grid -->
  <ellipse cx="400" cy="400" rx="240" ry="100" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <ellipse cx="400" cy="400" rx="100" ry="240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>

  <!-- ABCDEFi Voyager Mascot Silhouette & Helmet -->
  <g transform="translate(400, 420)">
    <!-- Shoulders / Armor -->
    <path d="M-120 160 L-80 60 L0 30 L80 60 L120 160 Z" fill="url(#voyagerHelm)" stroke="#c084fc" stroke-width="3"/>
    <!-- Chest Crest -->
    <polygon points="0,50 -25,90 25,90" fill="url(#goldGrad)" />
    <!-- Helmet Base -->
    <path d="M-60 40 C-60 -40 -40 -90 0 -90 C40 -90 60 -40 60 40 Z" fill="#1e1b4b" stroke="#a78bfa" stroke-width="4"/>
    <!-- Visor Glowing cyan -->
    <path d="M-45 -10 Q0 -35 45 -10 Q35 25 0 25 Q-35 25 -45 -10 Z" fill="#06b6d4" stroke="#67e8f9" stroke-width="3"/>
    <ellipse cx="0" cy="5" rx="30" ry="8" fill="#ecfeff" opacity="0.9"/>
    <!-- Crown / Apex Crest -->
    <path d="M-20 -90 L0 -130 L20 -90 L0 -100 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography & Badges -->
  <text x="400" y="110" font-family="'Outfit', sans-serif" font-size="36" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">ABCDEFI VOYAGER</text>
  <text x="400" y="150" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="2">WORLD LEGION NFT — APEX TIER</text>

  <!-- Coordinates & Status -->
  <rect x="250" y="690" width="300" height="44" rx="22" fill="rgba(15,23,42,0.8)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="718" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">TERRITORY CODE: WORLD | GENESIS</text>
</svg>
