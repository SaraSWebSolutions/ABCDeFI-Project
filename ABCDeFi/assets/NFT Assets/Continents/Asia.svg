<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="asiaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="400" r="360" fill="url(#asiaGlow)" />
  <circle cx="400" cy="400" r="300" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="16 8"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#f59e0b" stroke-width="4"/>

  <!-- Celestial Dragon Horns + Voyager Helmet -->
  <g transform="translate(400, 410)">
    <!-- Dragon Horn Left -->
    <path d="M-50 -70 C-110 -140 -160 -130 -140 -80 C-120 -40 -70 -30 -50 -50 Z" fill="url(#dragonGrad)"/>
    <!-- Dragon Horn Right -->
    <path d="M50 -70 C110 -140 160 -130 140 -80 C120 -40 70 -30 50 -50 Z" fill="url(#dragonGrad)"/>
    <!-- Shoulder Armor -->
    <path d="M-130 150 L-90 50 L0 20 L90 50 L130 150 Z" fill="#7f1d1d" stroke="#f87171" stroke-width="3"/>
    <!-- Helmet -->
    <path d="M-60 30 C-60 -50 -40 -90 0 -90 C40 -90 60 -50 60 30 Z" fill="#1e1b4b" stroke="#ef4444" stroke-width="4"/>
    <!-- Glowing Visor -->
    <path d="M-45 -10 Q0 -35 45 -10 Q35 25 0 25 Q-35 25 -45 -10 Z" fill="#fbbf24" stroke="#fef08a" stroke-width="3"/>
  </g>

  <text x="400" y="110" font-family="'Outfit', sans-serif" font-size="36" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">ASIA LEGION NFT</text>
  <text x="400" y="150" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#ef4444" text-anchor="middle" letter-spacing="2">CONTINENT TIER | CODE: AS</text>
  
  <rect x="250" y="690" width="300" height="44" rx="22" fill="rgba(15,23,42,0.8)" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="718" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#fca5a5" text-anchor="middle">CHARACTER: VOYAGER DRAGON</text>
</svg>
