      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="70%" stop-color="#fef7cd"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <radialGradient id="sphereShineDST" cx="35%" cy="30%" r="65%">
