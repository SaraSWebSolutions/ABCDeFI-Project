    <text x="52" y="55" font-family="'Outfit', sans-serif" font-size="62" font-weight="900" fill="#0f172a" text-anchor="start" letter-spacing="3">SG</text>
  </g>

  <text x="400" y="275" font-family="'Outfit', sans-serif" font-size="52" font-weight="900" fill="#b91c1c" text-anchor="middle">Singapore APAC</text>
  <text x="400" y="335" font-family="'Outfit', sans-serif" font-size="48" font-weight="900" fill="#dc2626" text-anchor="middle">Country Hub</text>

  <g transform="translate(400, 520)">
