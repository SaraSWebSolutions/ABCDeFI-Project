<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMUM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <radialGradient id="sphereShineMUM" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="suitGradMUM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGradMUM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGradMUM)"/>

  <!-- TOP RIGHT: 3D Flag Sphere & MH Text -->
  <g transform="translate(460, 95)">
    <ellipse cx="0" cy="40" rx="34" ry="8" fill="#94a3b8" opacity="0.3"/>
    <g clip-path="url(#sphereClipMUM)">
      <clipPath id="sphereClipMUM">
        <circle cx="0" cy="0" r="38"/>
      </clipPath>
      <rect x="-40" y="-40" width="80" height="26.6" fill="#FF9933"/>
      <rect x="-40" y="-13.4" width="80" height="26.6" fill="#FFFFFF"/>
      <rect x="-40" y="13.2" width="80" height="26.8" fill="#128807"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#000080" stroke-width="1.5"/>
    </g>
    <circle cx="0" cy="0" r="38" fill="url(#sphereShineMUM)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

    <text x="50" y="-5" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" fill="#0f172a" text-anchor="start">Maharashtra</text>
    <text x="52" y="55" font-family="'Outfit', sans-serif" font-size="62" font-weight="900" fill="#0f172a" text-anchor="start" letter-spacing="3">MH</text>
  </g>

  <!-- MID CENTER: District Name -->
  <text x="400" y="275" font-family="'Outfit', sans-serif" font-size="52" font-weight="900" fill="#0369a1" text-anchor="middle">Mumbai Metro</text>
  <text x="400" y="335" font-family="'Outfit', sans-serif" font-size="48" font-weight="900" fill="#0284c7" text-anchor="middle">Franchise Node</text>

  <!-- CENTER ART: Gateway of India Silhouette & Astronaut -->
  <g transform="translate(400, 520)">
    <path d="M-140 80 L-140 -20 L-100 -50 L-60 -20 L-60 80 L-20 80 L-20 -80 L20 -80 L20 80 L60 80 L60 -20 L100 -50 L140 -20 L140 80 Z" fill="#0284c7" opacity="0.15"/>
    <circle cx="0" cy="-40" r="30" fill="none" stroke="#0284c7" stroke-width="4" opacity="0.2"/>

    <g transform="translate(0, 30)">
      <circle cx="0" cy="-80" r="45" fill="url(#goldGradMUM)"/>
      <circle cx="0" cy="-80" r="40" fill="#0f172a"/>
      <ellipse cx="0" cy="-76" rx="32" ry="24" fill="#0284c7" opacity="0.8"/>
      <path d="M-30 0 L30 0 L20 60 L-20 60 Z" fill="url(#suitGradMUM)"/>
      <circle cx="0" cy="20" r="14" fill="url(#goldGradMUM)"/>
    </g>
  </g>

  <!-- BOTTOM RIGHT: ABCDeFi Logo & Slogan -->
  <g transform="translate(560, 620)">
    <g transform="scale(0.85)">
      <text x="0" y="40" font-family="'Outfit', sans-serif" font-size="64" font-weight="900" fill="none" stroke="#3b82f6" stroke-width="3" letter-spacing="2">ABC</text>
      <circle cx="38" cy="10" r="12" fill="url(#goldGradMUM)"/>
      <text x="135" y="40" font-family="'Outfit', sans-serif" font-size="64" font-weight="900" fill="#f97316" letter-spacing="1">deFi</text>
    </g>
    <text x="110" y="115" font-family="'Inter', sans-serif" font-size="20" font-style="italic" font-weight="800" fill="#1e293b" text-anchor="middle">Finance for everyone</text>
  </g>
</svg>
