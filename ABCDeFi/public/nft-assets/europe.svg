      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef8dc"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="labGlowEU" cx="50%" cy="30%" r="60%">
