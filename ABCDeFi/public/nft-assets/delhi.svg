<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDEL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="70%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <radialGradient id="sphereShineDEL" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="goldGradDEL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGradDEL)"/>

  <g transform="translate(460, 95)">
    <ellipse cx="0" cy="40" rx="34" ry="8" fill="#94a3b8" opacity="0.3"/>
    <g clip-path="url(#sphereClipDEL)">
      <clipPath id="sphereClipDEL">
        <circle cx="0" cy="0" r="38"/>
      </clipPath>
      <rect x="-40" y="-40" width="80" height="26.6" fill="#FF9933"/>
      <rect x="-40" y="-13.4" width="80" height="26.6" fill="#FFFFFF"/>
      <rect x="-40" y="13.2" width="80" height="26.8" fill="#128807"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#000080" stroke-width="1.5"/>
    </g>
    <circle cx="0" cy="0" r="38" fill="url(#sphereShineDEL)"/>

    <text x="50" y="-5" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" fill="#0f172a" text-anchor="start">Delhi</text>
    <text x="52" y="55" font-family="'Outfit', sans-serif" font-size="62" font-weight="900" fill="#0f172a" text-anchor="start" letter-spacing="3">DL</text>
  </g>

  <text x="400" y="275" font-family="'Outfit', sans-serif" font-size="52" font-weight="900" fill="#c2410c" text-anchor="middle">Delhi Capital</text>
  <text x="400" y="335" font-family="'Outfit', sans-serif" font-size="48" font-weight="900" fill="#ea580c" text-anchor="middle">State Node</text>

  <g transform="translate(400, 520)">
    <circle cx="0" cy="-60" r="50" fill="url(#goldGradDEL)"/>
    <circle cx="0" cy="-60" r="44" fill="#0f172a"/>
    <ellipse cx="0" cy="-56" rx="36" ry="26" fill="#ea580c" opacity="0.8"/>
  </g>

  <g transform="translate(560, 620)">
    <g transform="scale(0.85)">
      <text x="0" y="40" font-family="'Outfit', sans-serif" font-size="64" font-weight="900" fill="none" stroke="#ea580c" stroke-width="3" letter-spacing="2">ABC</text>
      <circle cx="38" cy="10" r="12" fill="url(#goldGradDEL)"/>
      <text x="135" y="40" font-family="'Outfit', sans-serif" font-size="64" font-weight="900" fill="#f97316" letter-spacing="1">deFi</text>
    </g>
    <text x="110" y="115" font-family="'Inter', sans-serif" font-size="20" font-style="italic" font-weight="800" fill="#1e293b" text-anchor="middle">Finance for everyone</text>
  </g>
</svg>
