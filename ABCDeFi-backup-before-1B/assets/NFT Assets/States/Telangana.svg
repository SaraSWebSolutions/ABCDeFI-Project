<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="tgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="400" cy="400" r="360" fill="url(#tgGlow)" />
  <circle cx="400" cy="400" r="300" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Kakatiya Arch / Emerald Wings -->
  <g transform="translate(400, 410)">
    <!-- Emerald Wings -->
    <path d="M-50 -40 C-120 -100 -180 -50 -150 20 C-120 50 -70 10 -50 -20 Z" fill="#059669"/>
    <path d="M50 -40 C120 -100 180 -50 150 20 C120 50 70 10 50 -20 Z" fill="#059669"/>
    
    <!-- Shoulders -->
    <path d="M-130 150 L-90 50 L0 20 L90 50 L130 150 Z" fill="#064e3b" stroke="#10b981" stroke-width="3"/>
    <!-- Helmet -->
    <path d="M-60 30 C-60 -50 -40 -90 0 -90 C40 -90 60 -50 60 30 Z" fill="#1e1b4b" stroke="#10b981" stroke-width="4"/>
    <!-- Visor -->
    <path d="M-45 -10 Q0 -35 45 -10 Q35 25 0 25 Q-35 25 -45 -10 Z" fill="#6ee7b7" stroke="#a7f3d0" stroke-width="3"/>
  </g>

  <text x="400" y="110" font-family="'Outfit', sans-serif" font-size="36" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">TELANGANA LEGION NFT</text>
  <text x="400" y="150" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="2">STATE TIER | CODE: TG | PARENT: INDIA</text>
  
  <rect x="250" y="690" width="300" height="44" rx="22" fill="rgba(15,23,42,0.8)" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="718" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#a7f3d0" text-anchor="middle">CHARACTER: VOYAGER EMERALD FALCON</text>
</svg>
